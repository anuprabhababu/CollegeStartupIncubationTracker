<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Your CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div class="container mt-5">
<h3 class="mb-4 text-center">Register</h3>

<form id="registerForm">

<div class="mb-3">
<label>Full Name</label>
<input type="text" class="form-control" id="name" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" id="email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" id="password" required>
</div>

<div class="mb-3">
<label>Register As</label>

<select class="form-control" id="role" onchange="toggleFields()">

<option value="student">Student</option>
<option value="mentor">Mentor</option>
<option value="investor">Investor</option>
</select>
</div>


<!-- STUDENT -->
<div id="studentFields">
<div class="mb-3">
<label>Department</label>
<input type="text" class="form-control" id="dept">
</div>

<div class="mb-3">
<label>Year</label>
<input type="number" class="form-control" id="year">
</div>

<div class="mb-3">
<label>Mobile</label>
<input type="text" class="form-control" id="studentMobile">
</div>
</div>

<!-- MENTOR -->
<div id="mentorFields" style="display:none;">
<div class="mb-3">
<label>Mobile</label>
<input type="text" class="form-control" id="mentorMobile">
</div>

<div class="mb-3">
<label>Expertise</label>
<input type="text" class="form-control" id="expertise">
</div>
</div>

<button class="btn btn-success w-100">Register</button>

</form>

<p id="message" class="mt-3 text-center"></p>

</div>

<script>

// toggle
function toggleFields(){
  const role = document.getElementById("role").value;

  document.getElementById("studentFields").style.display =
    role === "student" ? "block" : "none";

  document.getElementById("mentorFields").style.display =
    role === "mentor" ? "block" : "none";
}

// submit
document.getElementById("registerForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const role = document.getElementById("role").value;

  // ✅ ALWAYS use getElementById
  const nameVal = document.getElementById("name").value.trim();
  const emailVal = document.getElementById("email").value.trim();
  const passwordVal = document.getElementById("password").value.trim();

  let body = {
    name: nameVal,
    email: emailVal,
    password: passwordVal,
    role
  };

  // STUDENT
  if(role === "student"){
    const dept = document.getElementById("dept").value.trim();
    const year = document.getElementById("year").value.trim();
    const mobile = document.getElementById("studentMobile").value.trim();

    if(!dept || !year || !mobile){
      alert("Please fill all student fields");
      return;
    }

    body.dept = dept;
    body.year = year;
    body.mobile = mobile;
  }

  // MENTOR
  if(role === "mentor"){
    const mobile = document.getElementById("mentorMobile").value.trim();
    const expertise = document.getElementById("expertise").value.trim();

    if(!mobile || !expertise){
      alert("Please fill all mentor fields");
      return;
    }

    body.contact_number = mobile;
    body.expertise_area = expertise;
  }

  console.log(body); // ✅ DEBUG

  try{
    const res = await fetch("/api/auth/register",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    const msg = document.getElementById("message");

    if(res.ok){
      msg.innerHTML = "✅ Registered!";
      msg.style.color = "lime";

      setTimeout(()=>{
        window.location.href =
          role === "student"
          ? "dashboards.html"
          : "dashboardm.html";
      },1000);

    } else {
      msg.innerHTML = "❌ " + data.error;
      msg.style.color = "red";
    }

  }catch(err){
    console.error(err);
  }

});
</script>

</body>
</html>
