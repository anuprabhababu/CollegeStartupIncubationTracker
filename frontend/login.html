<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<div class="container mt-5" style="max-width:420px">

<div class="card p-4">

<h4 class="text-center mb-4">Startup Incubation Tracker</h4>

<form id="loginForm">

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" id="email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" id="password" required>
</div>

<button class="btn btn-primary w-100">
Login
</button>

</form>

<p id="message" class="text-center mt-3"></p>

<div class="text-center mt-2">
<a href="register.html">Create account</a>
</div>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

e.preventDefault()

const email=document.getElementById("email").value
const password=document.getElementById("password").value

const res=await fetch("/api/auth/login",{
method:"POST",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({email,password})
})

const data=await res.json()

const msg=document.getElementById("message")

if(res.ok){

  msg.innerHTML="Login successful"
  msg.style.color="green"

  // ✅ store full user (already includes role)
  localStorage.setItem("user",JSON.stringify(data.user))

  setTimeout(()=>{

    // 🔥 REDIRECT BASED ON ROLE
    if(data.user.role === "student"){
      window.location.href="/dashboards.html"
    }
    else if(data.user.role === "mentor"){
      window.location.href="/dashboardm.html"
    }
    
    else if(data.user.role === "investor"){
      window.location.href="/investor_dashboard.html"
    }
  },1000)

}else{

  msg.innerHTML=data.error
  msg.style.color="red"

}

})

</script>

</body>
</html>
