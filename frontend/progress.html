<!DOCTYPE html>
<html>
<head>
<title>Startup Progress</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<div class="container mt-5" style="max-width:700px;">

<h3 id="startupName"></h3>

<p><b>Domain:</b> <span id="domain"></span></p>
<p><b>Description:</b> <span id="desc"></span></p>
<p><b>Status:</b> <span id="status"></span></p>

<hr>

<h5>Request Mentor</h5>

<select id="mentorSelect" class="form-control mb-3"></select>

<button id="sendBtn" class="btn btn-primary" onclick="requestMentor()">
Send Request
</button>

<p id="message" class="mt-3"></p>

<a href="startups.html" id="backBtn"
class="btn btn-outline-light mt-2"
style="display:none;">
Go Back
</a>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  window.location.href="/login.html";
}

const params = new URLSearchParams(window.location.search);
const startup_id = params.get("id");

/* LOAD STARTUP DETAILS */
async function loadStartup(){

const res = await fetch("/api/startups");
const data = await res.json();

const s = data.find(x => x.startup_id == startup_id);

if(!s) return;

document.getElementById("startupName").innerText = s.startup_name;
document.getElementById("domain").innerText = s.domain;
document.getElementById("desc").innerText = s.idea_description;
document.getElementById("status").innerText = s.current_status;

}

loadStartup();


/* LOAD MENTORS */
async function loadMentors(){

const res = await fetch("/api/mentors");
const mentors = await res.json();

const select = document.getElementById("mentorSelect");

select.innerHTML = "<option value=''>Select Mentor</option>";

mentors.forEach(m => {
select.innerHTML += `<option value="${m.mentor_id}">
${m.mentor_name} (${m.expertise_area})
</option>`;
});

}

loadMentors();


/* ✅ FIXED SEND REQUEST FUNCTION */
async function requestMentor(){

const mentor_id = document.getElementById("mentorSelect").value;

if(!mentor_id){
alert("Please select a mentor");
return;
}

const res = await fetch("/api/requests",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({
startup_id,
mentor_id
})
});

const data = await res.json();

if(res.ok){

/* CLEAR DROPDOWN */
document.getElementById("mentorSelect").selectedIndex = 0;

/* SHOW MESSAGE */
document.getElementById("message").innerHTML =
"✅ " + (data.message || "Request sent successfully");

/* SHOW BACK BUTTON */
document.getElementById("backBtn").style.display = "inline-block";

/* DISABLE BUTTON */
document.getElementById("sendBtn").disabled = true;

}else{

document.getElementById("message").innerHTML =
"❌ " + (data.message || "Request already sent");

}
}


/* ✅ CHECK STATUS (PREVENT DUPLICATE + SHOW ACCEPTED) */
async function checkRequestStatus(){

const res = await fetch("/api/requests/student/" + user.id);
const data = await res.json();

data.forEach(r => {

if(r.startup_id == startup_id){

document.getElementById("sendBtn").disabled = true;

if(r.status === "Pending"){
document.getElementById("message").innerHTML =
"⏳ Request Pending";
}

if(r.status === "Accepted"){
document.getElementById("message").innerHTML =
"🎉 Mentor accepted your request!";
}

}

});

}

checkRequestStatus();

</script>

</body>
</html>
