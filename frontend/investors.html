<!DOCTYPE html>
<html>
<head>
  <title>Investor List</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<div class="container mt-4">

  <h2 class="text-center">Investor Directory</h2>

  <div class="row mt-3" id="investorContainer">
  </div>

  <a href="index.html" class="btn btn-outline-dark mt-3">
    Back to Home
  </a>

</div>

<script>

/* Load investors from backend */

async function loadInvestors(){

  try{

    const res = await fetch("/api/investors");
    const investors = await res.json();

    const container = document.getElementById("investorContainer");

    container.innerHTML = "";

    investors.forEach(inv => {

      container.innerHTML += `
        <div class="col-md-4">
          <div class="card p-3 shadow mb-3">
            <h5>${inv.investor_name}</h5>
            <p><strong>Type:</strong> ${inv.investor_type}</p>
            <p><strong>Contact:</strong> ${inv.contact_info}</p>
          </div>
        </div>
      `;

    });

  }catch(err){
    console.error("Error loading investors:", err);
  }

}

loadInvestors();

</script>

</body>
</html>
