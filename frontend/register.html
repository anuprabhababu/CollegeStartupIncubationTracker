  <title>Register</title>

<body>

<div class="container mt-5">
<h3 class="mb-4 text-center">Register</h3>

<form id="registerForm">

<div class="mb-3">
<label>Full Name</label>
<input type="text" class="form-control" id="name" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" id="email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" id="password" required>
</div>

<div class="mb-3">
<label>Register As</label>

<select class="form-control" id="role" onchange="toggleFields()">

<option value="student">Student</option>
<option value="mentor">Mentor</option>
</select>
</div>


<!-- STUDENT -->
<div id="studentFields">
<div class="mb-3">
<label>Department</label>
<input type="text" class="form-control" id="dept">
</div>

<div class="mb-3">
<label>Year</label>
<input type="number" class="form-control" id="year">
</div>

<div class="mb-3">
<label>Mobile</label>
<input type="text" class="form-control" id="studentMobile">
</div>
</div>

<!-- MENTOR -->
<div id="mentorFields" style="display:none;">
<div class="mb-3">
<label>Mobile</label>
<input type="text" class="form-control" id="mentorMobile">
</div>

<div class="mb-3">
<label>Expertise</label>
<input type="text" class="form-control" id="expertise">
</div>
</div>

<button class="btn btn-success w-100">Register</button>

</form>

<p id="message" class="mt-3 text-center"></p>

</div>
