<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
<div class="container d-flex justify-content-between align-items-center">

<h5 class="mb-0">Startup Incubation Tracker</h5>

<div>
<a href="profile.html" class="btn btn-outline-dark btn-sm me-2">Profile</a>

<button class="btn btn-outline-dark btn-sm" onclick="logout()">
Logout
</button>
</div>

</div>
</nav>

<div class="container mt-4">

<h4 id="welcomeText"></h4>

<!-- ONLY ONE CARD -->
<div class="row mt-4 g-3">

<div class="col-md-4">
<div class="card p-3 text-center">
<h5>Register Startup</h5>
<a href="add_startup.html" class="btn btn-primary mt-2">Add Startup</a>
</div>
</div>

</div>

<hr class="mt-5">

<!-- MY STARTUPS -->
<h4>My Startups</h4>

<table class="table table-bordered mt-3">

<thead>
<tr>
<th>Startup</th>
<th>Domain</th>
<th>Status</th>
</tr>
</thead>

<tbody id="startupTable"></tbody>

</table>

</div>

<script>

/* GET USER */
const user = JSON.parse(localStorage.getItem("user"));

if(!user || !user.id){
  window.location.href="/login.html";
}

document.getElementById("welcomeText").innerText =
"Welcome, " + user.name;


/* LOAD ONLY MY STARTUPS */
async function loadStartups(){

  try{

    const res = await fetch("/api/startups/student/" + user.id);
    const startups = await res.json();

    const table = document.getElementById("startupTable");
    table.innerHTML = "";

    startups.forEach(s => {

      table.innerHTML += `
      <tr onclick="goToStartup(${s.startup_id})" style="cursor:pointer;">
        <td>${s.startup_name}</td>
        <td>${s.domain}</td>
        <td>${s.current_status}</td>
        
      </tr>
      `;

    });

  }catch(err){
    console.error(err);
  }

}

loadStartups();


/* CLICK → GO TO PROGRESS PAGE */
function goToStartup(id){
  window.location.href = "progress.html?id=" + id;
}


/* LOGOUT */
function logout(){
  localStorage.removeItem("user");
  window.location.href="/index.html";
}

</script>

</body>
</html>
