<!DOCTYPE html>
<html>
<head>
<title>Mentor Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<div class="container mt-5">

<h3>Mentor Requests</h3>

<table class="table table-bordered mt-3">

<thead>
<tr>
<th>Startup</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="requestTable"></tbody>

</table>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  window.location.href="/login.html";
}

/* LOAD REQUESTS */
async function loadRequests(){

  const res = await fetch("/api/requests/" + user.id);
  const data = await res.json();

  const table = document.getElementById("requestTable");
  table.innerHTML = "";

  data.forEach(r => {

    table.innerHTML += `
    <tr>
      <td>${r.startup_name}</td>
      <td>${r.status}</td>
      <td>
        ${
          r.status === "Pending"
          ? `
          <button class="btn btn-success btn-sm"
          onclick="accept(${r.request_id}, ${r.startup_id})">
          Accept</button>

          <button class="btn btn-danger btn-sm"
          onclick="reject(${r.request_id})">
          Reject</button>
          `
          : "-"
        }
      </td>
    </tr>
    `;

  });

}

loadRequests();


/* ACCEPT */
async function accept(request_id, startup_id){

  await fetch("/api/requests/accept",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      request_id,
      startup_id,
      mentor_id:user.id
    })
  });

  alert("Accepted");
  loadRequests();
}


/* REJECT */
async function reject(request_id){

  await fetch("/api/requests/reject",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ request_id })
  });

  alert("Rejected");
  loadRequests();
}

</script>

</body>
</html>
