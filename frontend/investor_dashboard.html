<!DOCTYPE html>
<html>
<head>
<title>Investor Dashboard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<nav class="navbar p-3" style="background:#111827;">
  <div class="container d-flex justify-content-between">
    <h5 style="color:white;">Investor Dashboard</h5>

    <button class="btn btn-outline-light btn-sm" onclick="logout()">
      Logout
    </button>
  </div>
</nav>

<div class="container mt-5">

<h3 style="color:white;">Welcome Investor</h3>

<p style="color:white;">Here you will see startup requests from mentors.</p>

<table class="table table-bordered bg-white mt-3">
<thead>
<tr>
<th>Startup</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="investorTable"></tbody>
</table>

</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
window.location.href="/login.html";
}

/* LOAD REQUESTS */
async function loadRequests(){

const res = await fetch("/api/investor-requests/" + user.id);
const data = await res.json();

const table = document.getElementById("investorTable");

table.innerHTML = "";

data.forEach(r=>{
table.innerHTML += `
<tr>
<td>${r.startup_name}</td>
<td>${r.status}</td>
<td>
<button class="btn btn-success btn-sm"
onclick="accept(${r.request_id})">Accept</button>

<button class="btn btn-danger btn-sm"
onclick="reject(${r.request_id})">Reject</button>
</td>
</tr>
`;
});

}

loadRequests();


/* ACCEPT */
async function accept(id){

await fetch("/api/investor-requests/accept",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({ request_id:id })
});

alert("Accepted");
loadRequests();
}

/* REJECT */
async function reject(id){

await fetch("/api/investor-requests/reject",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({ request_id:id })
});

alert("Rejected");
loadRequests();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("user");
window.location.href="/index.html";
}

</script>

</body>
</html>
