<!DOCTYPE html>
<html>
<head>
  <title>Mentor Dashboard</title>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div class="container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center">
    <h3>Mentor Dashboard</h3>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </div>

  <hr>

  <!-- Welcome -->
  <h5 id="welcomeText"></h5>

  <!-- Mentor Info -->
  <div class="card mt-3 p-3">
    <h5>Your Profile</h5>
    <p><strong>Name:</strong> <span id="mentorName"></span></p>
    <p><strong>Email:</strong> <span id="mentorEmail"></span></p>
    <p><strong>Expertise:</strong> <span id="mentorExpertise"></span></p>
  </div>

  <!-- Assigned Startups -->
  <div class="card mt-3 p-3">
    <h5>Assigned Startups</h5>
    <ul id="startupList">
      <li>Startup A - AI Healthcare</li>
      <li>Startup B - FinTech App</li>
      <li>Startup C - EdTech Platform</li>
    </ul>
  </div>

  <!-- Actions -->
  <div class="card mt-3 p-3">
    <h5>Quick Actions</h5>
    <button class="btn btn-primary me-2">Add Feedback</button>
    <button class="btn btn-secondary">View Meetings</button>
  </div>

</div>

<script>

// 🔐 Check login
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  window.location.href = "login.html";
}

// ❌ Prevent student access
if(user.role !== "mentor"){
  alert("Access denied!");
  window.location.href = "login.html";
}

// 👋 Show data
document.getElementById("welcomeText").innerHTML = 
  "Welcome, " + user.name + " 👋";

document.getElementById("mentorName").innerText = user.name;
document.getElementById("mentorEmail").innerText = user.email || "Not available";
document.getElementById("mentorExpertise").innerText = user.expertise || "Not added";

// 🚪 Logout
function logout(){
  localStorage.removeItem("user");
  window.location.href = "index.html";
}

</script>

</body>
</html>
